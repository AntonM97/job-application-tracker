<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker - Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/common :: navbar('statistics')}"></div>

<main class="container py-4">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">Total Applications</h2>
                    <p class="display-6 mb-0" id="totalApplications">18</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">Last Month</h2>
                    <p class="display-6 mb-0" id="lastMonthApplications">7</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card h-100">
                <div class="card-body">
                    <h2 class="h6 text-muted">Last Week</h2>
                    <p class="display-6 mb-0" id="lastWeekApplications">2</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <section class="card h-100">
                <div class="card-body">
                    <h2 class="h5 mb-4">Breakdown by Status</h2>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><span>Wishlist</span><span>3</span></div>
                        <div class="progress"><div class="progress-bar bg-secondary" style="width: 17%"></div></div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><span>Applied</span><span>5</span></div>
                        <div class="progress"><div class="progress-bar bg-primary" style="width: 28%"></div></div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><span>Screening</span><span>4</span></div>
                        <div class="progress"><div class="progress-bar bg-info" style="width: 22%"></div></div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><span>Interview</span><span>3</span></div>
                        <div class="progress"><div class="progress-bar bg-warning" style="width: 17%"></div></div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between"><span>Offer</span><span>2</span></div>
                        <div class="progress"><div class="progress-bar bg-success" style="width: 11%"></div></div>
                    </div>
                    <div class="mb-4">
                        <div class="d-flex justify-content-between"><span>Rejected</span><span>1</span></div>
                        <div class="progress"><div class="progress-bar bg-danger" style="width: 5%"></div></div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead>
                            <tr>
                                <th>Status</th>
                                <th>Applications</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr><td>Wishlist</td><td>3</td></tr>
                            <tr><td>Applied</td><td>5</td></tr>
                            <tr><td>Screening</td><td>4</td></tr>
                            <tr><td>Interview</td><td>3</td></tr>
                            <tr><td>Offer</td><td>2</td></tr>
                            <tr><td>Rejected</td><td>1</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>

        <div class="col-lg-5">
            <section class="card h-100">
                <div class="card-body">
                    <h2 class="h5 mb-3">Status Distribution</h2>
                    <div class="chart-container-fixed">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: applicationModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/statistics.js"></script>
</body>
</html>
