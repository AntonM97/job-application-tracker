<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker - Kanban Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/common :: navbar('kanban')}"></div>

<main class="container-fluid py-4">
    <div class="row g-3 kanban-scroll-row">
        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column">
                <header class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h6 mb-0">Wishlist</h2>
                    <span class="badge text-bg-secondary">1</span>
                </header>
                <article class="card application-card mb-3">
                    <div class="card-body">
                        <h3 class="h5 card-title company-name">Stripe</h3>
                        <p class="card-text mb-1"><strong>Role:</strong> Senior Java Engineer</p>
                        <p class="card-text mb-1"><strong>Applied:</strong> 2026-03-28</p>
                        <p class="card-text mb-2"><strong>Salary:</strong> 120k - 150k</p>
                        <span class="badge text-bg-success mb-3">Dream</span>
                        <div class="mb-3">
                            <label class="form-label small mb-1">Change status</label>
                            <select class="form-select form-select-sm">
                                <option selected>Wishlist</option>
                                <option>Applied</option>
                                <option>Screening</option>
                                <option>Interview</option>
                                <option>Offer</option>
                                <option>Rejected</option>
                            </select>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#applicationModal">Edit</button>
                            <button class="btn btn-sm btn-outline-danger">Delete</button>
                            <button class="btn btn-sm btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </article>
            </section>
        </div>

        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column">
                <header class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h6 mb-0">Applied</h2>
                    <span class="badge text-bg-secondary">1</span>
                </header>
                <article class="card application-card mb-3">
                    <div class="card-body">
                        <h3 class="h5 card-title company-name">Spotify</h3>
                        <p class="card-text mb-1"><strong>Role:</strong> Backend Developer</p>
                        <p class="card-text mb-1"><strong>Applied:</strong> 2026-03-30</p>
                        <p class="card-text mb-2"><strong>Salary:</strong> Not specified</p>
                        <span class="badge text-bg-primary mb-3">Good</span>
                        <div class="mb-3">
                            <label class="form-label small mb-1">Change status</label>
                            <select class="form-select form-select-sm">
                                <option>Wishlist</option>
                                <option selected>Applied</option>
                                <option>Screening</option>
                                <option>Interview</option>
                                <option>Offer</option>
                                <option>Rejected</option>
                            </select>
                        </div>
                        <div class="d-flex flex-wrap gap-2">
                            <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#applicationModal">Edit</button>
                            <button class="btn btn-sm btn-outline-danger">Delete</button>
                            <button class="btn btn-sm btn-outline-secondary">View Details</button>
                        </div>
                    </div>
                </article>
            </section>
        </div>

        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column"><header class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 mb-0">Screening</h2><span class="badge text-bg-secondary">0</span></header></section>
        </div>
        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column"><header class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 mb-0">Interview</h2><span class="badge text-bg-secondary">0</span></header></section>
        </div>
        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column"><header class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 mb-0">Offer</h2><span class="badge text-bg-secondary">0</span></header></section>
        </div>
        <div class="col-12 col-md-6 col-xl-2">
            <section class="kanban-column"><header class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 mb-0">Rejected</h2><span class="badge text-bg-secondary">0</span></header></section>
        </div>
    </div>
</main>

<div th:replace="~{fragments/common :: applicationModal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
