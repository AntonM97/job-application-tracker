<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/kanban-board">
            <span class="logo-mark">JT</span>
            <span>Job Tracker</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'kanban'} ? ' active'" href="/kanban-board">Kanban Board</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'statistics'} ? ' active'" href="/statistics">Statistics</a>
                </li>
            </ul>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#applicationModal">Add New</button>
        </div>
    </div>
</nav>

<div th:fragment="applicationModal" class="modal fade" id="applicationModal" tabindex="-1"
     aria-labelledby="applicationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <form class="needs-validation" id="applicationForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="applicationModalLabel">Add / Edit Job Application</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="companyName" class="form-label">Company Name *</label>
                            <input type="text" class="form-control" id="companyName" required>
                            <div class="invalid-feedback">Company name is required.</div>
                        </div>
                        <div class="col-md-6">
                            <label for="jobTitle" class="form-label">Job Title *</label>
                            <input type="text" class="form-control" id="jobTitle" required>
                            <div class="invalid-feedback">Job title is required.</div>
                        </div>
                        <div class="col-12">
                            <label for="jobUrl" class="form-label">Job Posting URL</label>
                            <input type="url" class="form-control" id="jobUrl" placeholder="https://...">
                        </div>
                        <div class="col-md-6">
                            <label for="salaryMin" class="form-label">Salary Min</label>
                            <input type="number" class="form-control" id="salaryMin" min="0">
                        </div>
                        <div class="col-md-6">
                            <label for="salaryMax" class="form-label">Salary Max</label>
                            <input type="number" class="form-control" id="salaryMax" min="0">
                        </div>
                        <div class="col-md-6">
                            <label for="priority" class="form-label">Priority</label>
                            <select class="form-select" id="priority">
                                <option value="dream">Dream</option>
                                <option value="good">Good</option>
                                <option value="backup">Backup</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="Wishlist">Wishlist</option>
                                <option value="Applied">Applied</option>
                                <option value="Screening">Screening</option>
                                <option value="Interview">Interview</option>
                                <option value="Offer">Offer</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="contactPerson" class="form-label">Contact Person</label>
                            <input type="text" class="form-control" id="contactPerson" placeholder="Name Surname">
                        </div>
                        <div class="col-md-6">
                            <label for="contactEmail" class="form-label">Contact Email</label>
                            <input type="email" class="form-control" id="contactEmail" placeholder="name@company.com">
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" rows="4"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
